<!doctype html>
<html lang="en-GB">
<body style="margin:0;padding:24px;background:#F8F6F1;font-family:Arial,Helvetica,sans-serif;color:#18211D;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;background:#FFFFFF;border:1px solid #E2DDD2;border-radius:12px;">
    <tr><td style="padding:28px 28px 8px;">
      <h1 style="margin:0 0 12px;font-size:20px;line-height:1.3;">Confirm your email</h1>
      <p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#5E6863;">Thanks for registering your restaurant. Confirm your email address and we will review your trade account. You will hear from us once it is approved.</p>
      <p style="margin:0 0 24px;">
        <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/register/pending"
           style="display:inline-block;background:#1D5B45;color:#FFFFFF;text-decoration:none;font-weight:bold;font-size:15px;padding:12px 20px;border-radius:8px;">Confirm my email</a>
      </p>
      <p style="margin:0 0 24px;font-size:13px;line-height:1.6;color:#5E6863;">If you did not register, you can ignore this email.</p>
    </td></tr>
  </table>
</body>
</html>
